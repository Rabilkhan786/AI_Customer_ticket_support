services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  ui:
    build: .
    command: >
      streamlit run ui.py
      --server.address=0.0.0.0
      --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api